name: ScreenCap
options:
  bundleIdPrefix: com.sungwon
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Ad-hoc signing works for anyone out of the box. scripts/build.sh switches to a real team
    # when scripts/local.env sets DEVELOPMENT_TEAM (see scripts/local.env.example).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ScreenCap:
    type: application
    platform: macOS
    sources:
      - path: ScreenCap
        excludes:
          - "Info.plist"
          - "ScreenCap.entitlements"
    info:
      path: ScreenCap/Info.plist
      properties:
        CFBundleDisplayName: ScreenCap
        CFBundleName: ScreenCap
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "ScreenCap needs microphone access to record audio with your screen recordings."
        NSHumanReadableCopyright: "© 2026 SungWon Kim"
        NSPrincipalClass: NSApplication
    entitlements:
      path: ScreenCap/ScreenCap.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Required under the hardened runtime (release builds) for microphone recording.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sungwon.ScreenCap
        PRODUCT_NAME: ScreenCap
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
